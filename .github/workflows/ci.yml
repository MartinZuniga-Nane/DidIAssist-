name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run drift_dev schema steps drift_schemas/app_database lib/src/data/database/app_database.steps.dart
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: dart run drift_dev schema generate drift_schemas/app_database test/src/data/database/migrations/app_database/generated
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
