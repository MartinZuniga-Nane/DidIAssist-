name: did_i_assist
description: A local-first app that records class attendance using geofencing.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.8.0

dependencies:
  clock: ^1.1.2
  drift: ^2.28.0
  drift_flutter: ^0.2.5
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_local_notifications: ^19.5.0
  flutter_localizations:
    sdk: flutter
  flutter_timezone: ^4.1.1
  geolocator: ^14.0.2
  intl: ^0.20.2
  meta: ^1.16.0
  native_geofence: ^1.2.1
  permission_handler: ^12.0.3
  timezone: ^0.10.1
  uuid: ^4.5.1

dev_dependencies:
  build_runner: ^2.6.0
  drift_dev: ^2.28.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  very_good_analysis: ^9.0.0

flutter:
  generate: true
  uses-material-design: true
